services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.ndtstudio.site
      - NEXT_PUBLIC_CLOUDFLARE_IMAGES_HASH=${NEXT_PUBLIC_CLOUDFLARE_IMAGES_HASH}
    labels:
      - traefik.enable=true
      # Main domain
      - traefik.http.routers.frontend.rule=Host(`ndtstudio.site`) || Host(`www.ndtstudio.site`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_IMAGES_TOKEN=${CLOUDFLARE_IMAGES_TOKEN}
      - CLOUDFLARE_IMAGES_HASH=${CLOUDFLARE_IMAGES_HASH}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
      - ALLOWED_ORIGINS=https://ndtstudio.site,https://www.ndtstudio.site
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.ndtstudio.site`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.services.backend.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
