x-backend-build: &backend-build
  context: .
  dockerfile: apps/backend/Dockerfile

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network

  backend-migrate:
    build: *backend-build
    command:
      - /app/node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema
      - /app/prisma/schema.prisma
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL is required}
    networks:
      - dokploy-network

  backend:
    build: *backend-build
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL is required}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL is required}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:?CLOUDFLARE_R2_BUCKET_NAME is required}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      - R2_S3_ENDPOINT=${R2_S3_ENDPOINT:?R2_S3_ENDPOINT is required}
      - IMGPROXY_KEY=${IMGPROXY_KEY:?IMGPROXY_KEY is required}
      - IMGPROXY_SALT=${IMGPROXY_SALT:?IMGPROXY_SALT is required}
      - IMGPROXY_BASE_URL=${IMGPROXY_BASE_URL:?IMGPROXY_BASE_URL is required}
      - IMAGE_DELIVERY_MODE=${IMAGE_DELIVERY_MODE}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dokploy-network

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    container_name: imgproxy
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      - IMGPROXY_KEY=${IMGPROXY_KEY:?IMGPROXY_KEY is required}
      - IMGPROXY_SALT=${IMGPROXY_SALT:?IMGPROXY_SALT is required}
      - IMGPROXY_ALLOW_INSECURE=false
      - IMGPROXY_USE_S3=true
      - AWS_ACCESS_KEY_ID=${IMGPROXY_R2_ACCESS_KEY_ID:?IMGPROXY_R2_ACCESS_KEY_ID is required}
      - AWS_SECRET_ACCESS_KEY=${IMGPROXY_R2_SECRET_ACCESS_KEY:?IMGPROXY_R2_SECRET_ACCESS_KEY is required}
      - AWS_REGION=auto
      - IMGPROXY_S3_ENDPOINT=${R2_S3_ENDPOINT:?R2_S3_ENDPOINT is required}
      - IMGPROXY_CONCURRENCY=2
      - IMGPROXY_MAX_SRC_RESOLUTION=50
      - IMGPROXY_TTL=31536000
      - IMGPROXY_PREFERRED_FORMATS=webp,avif
      - IMGPROXY_ENFORCE_WEBP=true
      - IMGPROXY_MAX_ANIMATION_FRAMES=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imgproxy.rule=Host(`img.ndtstudio.site`)"
      - "traefik.http.routers.imgproxy.entrypoints=websecure"
      - "traefik.http.routers.imgproxy.tls.certresolver=letsencrypt"
      - "traefik.http.services.imgproxy.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  dokploy-network:
    external: true
